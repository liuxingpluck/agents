<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 训练场 · 烬渊</title>
<style>:root{--ember:#ff6a2a;--bone:#e8e2d6;--ink:#0b0a10;--line:#3a3642}*{box-sizing:border-box}html,body{background:var(--ink);min-height:100%;color:var(--bone);margin:0;font-family:Noto Serif SC,Songti SC,SimSun,Georgia,serif}header{flex-wrap:wrap;align-items:baseline;gap:18px;padding:18px 24px 8px;display:flex}header h1{letter-spacing:.3em;margin:0;font-size:26px}header a{color:var(--bone);opacity:.6;font-size:13px}header a:hover{color:var(--ember);opacity:1}header p{opacity:.6;flex-basis:100%;margin:0;font-size:13px;line-height:1.7}main{grid-template-columns:minmax(300px,380px) 1fr;gap:18px;padding:12px 24px 24px;display:grid}@media (max-width:860px){main{grid-template-columns:1fr;padding:12px 16px 24px}}section{border:1px solid var(--line);background:#12101a;padding:14px 16px}h2{letter-spacing:.3em;opacity:.7;margin:0 0 10px;font-size:14px;font-weight:400}label{justify-content:space-between;align-items:center;gap:10px;margin:8px 0;font-size:14px;display:flex}select,input[type=number]{color:var(--bone);border:1px solid var(--line);font:inherit;background:#1c1926;width:150px;padding:5px 8px}.row{flex-wrap:wrap;gap:8px;margin-top:12px;display:flex}button{color:var(--bone);border:1px solid var(--line);font:inherit;cursor:pointer;letter-spacing:.1em;background:#1c1926;padding:8px 14px}button:hover{border-color:var(--ember)}button.primary{background:var(--ember);color:#1a0d08;border-color:var(--ember);font-weight:700}dl{grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px;display:grid}dt{opacity:.6}dd{text-align:right;font-variant-numeric:tabular-nums;margin:0;font-family:ui-monospace,Menlo,Consolas,monospace}#chart{width:100%;height:190px;margin-top:6px;display:block}.legend{opacity:.75;gap:16px;margin-top:6px;font-size:12px;display:flex}.legend i{vertical-align:middle;width:14px;height:3px;margin-right:5px;display:inline-block}#arena-wrap{min-height:320px;padding:0;position:relative;overflow:hidden}#arena{aspect-ratio:16/9;width:100%;height:100%;min-height:320px;display:block}#arena-info{text-shadow:0 1px 4px #000;font-size:13px;line-height:1.7;position:absolute;top:10px;left:14px}#arena-info b{color:var(--ember)}.stack{flex-direction:column;gap:18px;min-width:0;display:flex}#status{opacity:.7;min-height:1.4em;margin-top:10px;font-size:13px}</style>
  <script type="module" crossorigin src="./assets/train-y-Vulrms.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/renderer-DULK96R0.js">
  <link rel="modulepreload" crossorigin href="./assets/trainer-Dc4sMhdS.js">
</head>
<body>
<header>
  <h1>AI 训练场</h1><a href="./index.html">← 返回游戏</a>
  <p>这里的 AI 完全在你的浏览器里训练:多个后台线程以最高速度空跑对战,用进化策略一代代改进一个小型神经网络。
     它直接读取游戏内部数据(位置、帧数、血量),不看画面。模型自动保存在本机,关掉页面下次可以接着练。</p>
</header>
<main>
  <div class="stack">
    <section>
      <h2>设置</h2>
      <label>训练角色 <select id="hero"></select></label>
      <label>对手角色 <select id="foe"></select></label>
      <label>后台线程数 <input id="workers" type="number" min="1" max="32" /></label>
      <label>自博弈(和过去的自己打) <input id="selfplay" type="checkbox" checked /></label>
      <div class="row">
        <button id="toggle" class="primary">开始训练</button>
        <button id="reset">重置模型</button>
        <button id="export">导出</button>
        <button id="import">导入</button>
        <input id="file" type="file" accept=".json" hidden />
      </div>
      <div id="status"></div>
    </section>
    <section>
      <h2>进度</h2>
      <dl>
        <dt>代数</dt><dd id="s-gen">0</dd>
        <dt>对脚本 AI 胜率</dt><dd id="s-win">—</dd>
        <dt>造成 / 承受伤害</dt><dd id="s-dmg">—</dd>
        <dt>考试中最高连击</dt><dd id="s-combo">—</dd>
        <dt>本代平均 / 最高分</dt><dd id="s-fit">—</dd>
        <dt>模拟速度(上限估计)</dt><dd id="s-sps">—</dd>
        <dt>每代耗时</dt><dd id="s-ms">—</dd>
        <dt>对手池</dt><dd id="s-pool">0</dd>
      </dl>
      <canvas id="chart"></canvas>
      <div class="legend"><span><i style="background:#ff6a2a"></i>胜率</span><span><i style="background:#e8e2d6"></i>伤害差(造成 − 承受)</span></div>
    </section>
  </div>
  <section id="arena-wrap">
    <canvas id="arena"></canvas>
    <div id="arena-info"></div>
  </section>
</main>
</body>
</html>
