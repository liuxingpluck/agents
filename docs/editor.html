<!doctype html>
<html lang="zh-CN">

<title>角色 / 地图编辑器 · 烬渊</title>
<style>:root{--ember:#ff6a2a;--bone:#e8e2d6;--ink:#0b0a10;--line:#3a3642;--panel:#12101a;--field:#1c1926;--bad:#e0584a;--good:#6fbf73}*{box-sizing:border-box}html,body{background:var(--ink);min-height:100%;color:var(--bone);margin:0;font-family:Noto Serif SC,Songti SC,SimSun,Georgia,serif}header{flex-wrap:wrap;align-items:baseline;gap:18px;padding:18px 24px 8px;display:flex}header h1{letter-spacing:.3em;margin:0;font-size:26px}header a{color:var(--bone);opacity:.6;font-size:13px}header a:hover{color:var(--ember);opacity:1}header p{opacity:.6;flex-basis:100%;margin:0;font-size:13px;line-height:1.7}.note{opacity:.7;font-size:12px;line-height:1.6}.note.warn{color:var(--bad);opacity:1}main{grid-template-columns:minmax(0,1fr) minmax(340px,520px);align-items:start;gap:18px;padding:8px 24px 32px;display:grid}@media (max-width:1000px){main{grid-template-columns:1fr;padding:8px 16px 24px}#side{order:-1;position:static!important}}#side{flex-direction:column;gap:10px;display:flex;position:sticky;top:12px}#arena-wrap{border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden}#arena{aspect-ratio:16/9;outline:none;width:100%;display:block}#arena:focus{box-shadow:inset 0 0 0 2px var(--ember)}#arena-info{text-shadow:0 1px 4px #000;pointer-events:none;font-size:13px;line-height:1.7;position:absolute;top:8px;left:12px}#arena-info b{color:var(--ember)}#tabbar{border-bottom:1px solid var(--line);flex-wrap:wrap;gap:4px;margin-bottom:14px;display:flex}.tab-btn{letter-spacing:.25em;opacity:.6;background:0 0;border:1px solid #0000;border-bottom:none;padding:9px 20px}.tab-btn.on{background:var(--panel);border-color:var(--line);opacity:1;color:var(--ember)}section{border:1px solid var(--line);background:var(--panel);margin:0 0 14px;padding:12px 16px 14px}h3{letter-spacing:.3em;opacity:.75;margin:0 0 10px;font-size:14px;font-weight:400}h4{opacity:.65;margin:14px 0 6px;font-size:13px;font-weight:400}h4 label{opacity:1}.hint{opacity:.6;margin:0 0 8px;font-size:12px;line-height:1.7}label.fld{flex-direction:column;gap:4px;min-width:0;font-size:12px;display:flex}label.fld>span{opacity:.65}.inline{align-items:center;gap:6px;font-size:13px;display:inline-flex}input[type=text],input[type=number],select,textarea{background:var(--field);color:var(--bone);border:1px solid var(--line);font:inherit;width:100%;min-width:0;padding:5px 8px;font-size:14px}textarea{resize:vertical;line-height:1.6}input[type=color]{border:1px solid var(--line);background:var(--field);width:44px;height:30px;padding:0}input[type=checkbox],input[type=radio]{accent-color:var(--ember)}select[multiple]{padding:2px}.w90{width:92px!important}.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 14px;margin-bottom:6px;display:grid}.grid.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.grid.g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.grid.g5{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.checks{flex-wrap:wrap;gap:18px;margin:8px 0;font-size:13px;display:flex}.row{flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0;display:flex}.row select{width:auto}button{background:var(--field);color:var(--bone);border:1px solid var(--line);font:inherit;cursor:pointer;letter-spacing:.1em;padding:7px 14px;font-size:14px}button:hover{border-color:var(--ember)}button.primary{background:var(--ember);color:#1a0d08;border-color:var(--ember);font-weight:700}button.danger{color:var(--bad)}button.danger:hover{border-color:var(--bad)}button.sm{padding:3px 9px;font-size:12px}.list{flex-wrap:wrap;gap:6px;margin:0 0 12px;display:flex}.list .item{text-align:left}.list .item.on{border-color:var(--ember);color:var(--ember)}.list small{opacity:.6;font-size:11px}.empty{opacity:.6;padding:6px 0;font-size:13px}.tablewrap{overflow-x:auto}table.moves{border-collapse:collapse;width:100%;font-size:13px}table.moves th{text-align:left;opacity:.6;border-bottom:1px solid var(--line);white-space:nowrap;padding:4px 6px;font-weight:400}table.moves td{vertical-align:top;padding:3px 4px}table.moves td input[type=text],table.moves td input[type=number],table.moves td select{padding:3px 5px;font-size:13px}table.moves td select{min-width:84px}table.moves td.acts{white-space:nowrap}table.moves tr.tier4>td:first-child{border-left:2px solid var(--ember)}tr.detail>td{border:1px solid var(--line);background:#0e0c15;padding:8px 12px 12px}.maprow{align-items:center;gap:8px;margin:5px 0;display:flex}.maprow select{width:auto;min-width:120px}.tag{opacity:.8;min-width:44px;color:var(--ember);font-size:12px}.wave{flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0;display:flex}.wave select{width:auto}.chips{flex-wrap:wrap;gap:5px;display:inline-flex}.chip{background:var(--field);border:1px solid var(--line);align-items:center;gap:4px;padding:2px 4px 2px 9px;font-size:13px;display:inline-flex}.chip .x{background:0 0;border:none;padding:0 6px;font-size:15px}.errs{font-size:13px;line-height:1.7}.errs ul{margin:4px 0 0;padding-left:20px}.errs.bad{border-left:3px solid var(--bad);padding-left:10px}.errs .cnt{color:var(--bad)}.errs.good .ok{color:var(--good)}.graphbox{overflow-x:auto}svg.graph{border:1px solid var(--line);background:#0e0c15;width:100%;max-width:520px;height:auto;display:block}svg.graph .lane{fill:#15121d}svg.graph text.lanelabel{text-anchor:start;opacity:.4;font-size:10px}svg.graph .edge{fill:none;stroke:#77707f;stroke-width:1.6px}svg.graph .edge.cross{stroke:var(--ember);opacity:.75}svg.graph .arrow{fill:#77707f}svg.graph .node{stroke:var(--bone);stroke-width:1.5px;fill:#2a2733}svg.graph .node.k-elite{fill:#6b5520;stroke:#d9b24a}svg.graph .node.k-rest{fill:#1f4a2c;stroke:var(--good)}svg.graph .node.k-boss{fill:#6a1f1a;stroke:var(--bad)}svg.graph .node.start{stroke-width:3px}svg.graph text{fill:var(--bone);text-anchor:middle;font-size:11px}svg.graph .nodelabel{opacity:.75;font-size:10px}svg.graph .startmark{fill:var(--ember);font-size:11px}</style>

<header>

  </aside>
