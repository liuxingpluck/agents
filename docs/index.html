<style>:root{--ember:#ff6a2a;--bone:#e8e2d6;--ink:#07060a}html,body{background:var(--ink);height:100%;color:var(--bone);-webkit-user-select:none;user-select:none;margin:0;font-family:Noto Serif SC,Songti SC,SimSun,Georgia,serif;overflow:hidden}#game{width:100%;height:100%;display:block;position:fixed;inset:0}#hud{pointer-events:none;text-shadow:0 2px 6px #000;position:fixed;inset:0}.panel{width:min(36vw,420px);position:absolute;top:18px}#player{left:20px}#enemy{text-align:right;opacity:0;transition:opacity .3s;right:20px}.name{letter-spacing:.12em;margin-bottom:6px;font-size:15px}.bar{background:#0009;border:1px solid #5b5560;height:14px;overflow:hidden;transform:skew(-18deg)}.bar>i{background:linear-gradient(#d94a3a,#7a1f1f);width:100%;height:100%;transition:width .12s;display:block}.bar.en{width:70%;height:7px;margin-top:5px}.bar.en>i{background:linear-gradient(#ffb347, var(--ember));width:0}#enemy .bar{margin-left:auto}#enemy .bar>i{background:linear-gradient(#b9b4ad,#55555c);margin-left:auto}#wave{letter-spacing:.3em;opacity:.7;font-size:13px;position:absolute;top:18px;left:50%;transform:translate(-50%)}#combo{text-align:right;opacity:0;font-style:italic;transition:opacity .25s;position:absolute;top:26vh;right:5vw}#combo-n{color:var(--ember);font-size:84px;font-weight:900;line-height:1}#combo small{letter-spacing:.4em;font-size:14px;display:block}#combo.pop #combo-n{animation:.18s pop}@keyframes pop{0%{transform:scale(1.5)}to{transform:scale(1)}}#flash{text-align:center;letter-spacing:.5em;opacity:0;font-size:30px;position:absolute;top:30vh;left:0;right:0}#flash.show{animation:2.2s flash}@keyframes flash{0%{opacity:0;letter-spacing:1em}15%,70%{opacity:1;letter-spacing:.5em}to{opacity:0}}#banner{text-align:center;background:radial-gradient(#000a 0%,#000d 70%);flex-direction:column;justify-content:center;align-items:center;display:none;position:absolute;inset:0}#banner.show{animation:.6s fadein;display:flex}@keyframes fadein{0%{opacity:0}}#banner-title{letter-spacing:.3em;background:linear-gradient(#f4e9d8 30%, var(--ember));color:#0000;text-shadow:none;-webkit-background-clip:text;background-clip:text;margin-right:-.3em;font-size:clamp(48px,9vw,120px);font-weight:900}#banner-sub{letter-spacing:.15em;opacity:.9;margin-top:18px;font-size:16px;line-height:1.9}#banner-sub b{color:var(--ember)}#banner-sub em{letter-spacing:.6em;opacity:.6;font-size:13px}#select{pointer-events:auto;background:radial-gradient(#000b 0%,#000e 75%);flex-direction:column;justify-content:center;align-items:center;display:none;position:absolute;inset:0}#select.show{animation:.4s fadein;display:flex}#select h1{letter-spacing:.6em;opacity:.8;margin:0 0 22px;font-size:22px;font-weight:400}#cards{grid-template-columns:repeat(5,132px);gap:12px;display:grid}.card{all:unset;cursor:pointer;background:linear-gradient(160deg, var(--c), #0b0a10 70%);border:1px solid #5b5560;flex-direction:column;justify-content:center;align-items:center;gap:6px;height:86px;transition:transform .12s;display:flex;position:relative}.card:after{content:"";background:var(--c2);height:4px;position:absolute;bottom:0;left:0;right:0}.card b{letter-spacing:.2em;font-size:20px}.card span{opacity:.7;letter-spacing:.2em;font-size:12px}.card.on{border-color:var(--ember);transform:translateY(-6px);box-shadow:0 0 22px #ff6a2a66}#detail{text-align:left;width:min(708px,90vw);min-height:190px;margin-top:22px;font-size:14px;line-height:1.8}#detail h2{letter-spacing:.15em;margin:0 0 6px;font-size:26px}#detail h2 small{opacity:.65;margin-left:10px;font-size:14px}#detail p{margin:4px 0}.mono{opacity:.75;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}#select .tip{opacity:.55;letter-spacing:.15em;margin-top:10px;font-size:12px}#boss{text-align:center;opacity:0;width:min(60vw,720px);transition:opacity .4s;position:absolute;bottom:84px;left:50%;transform:translate(-50%)}#boss.show{opacity:1}#boss .name{color:var(--ember);letter-spacing:.3em}#boss .bar{height:12px}#boss .bar>i{background:linear-gradient(#ff8a4a,#8a1f10)}#go{color:var(--ember);opacity:0;letter-spacing:.1em;font-size:54px;font-style:italic;font-weight:900;position:absolute;top:44vh;right:5vw}#go.show{animation:.9s infinite go}@keyframes go{0%,to{opacity:1;transform:translate(0)}50%{opacity:.35;transform:translate(16px)}}#fade{opacity:0;background:#000;transition:opacity .4s;position:absolute;inset:0}#fade.on{opacity:1}#map{pointer-events:auto;background:radial-gradient(#000c 0%,#000 80%);flex-direction:column;justify-content:center;align-items:center;display:none;position:absolute;inset:0}#map.show{animation:.4s fadein;display:flex}#map h1{letter-spacing:.4em;margin:0 0 6px;font-size:24px;font-weight:400}#map-svg{width:min(820px,94vw);height:auto}#map-info{text-align:center;letter-spacing:.1em;min-height:3.4em;font-size:14px;line-height:1.7}#map-info b{color:var(--ember)}#map .tip{opacity:.55;letter-spacing:.15em;margin-top:6px;font-size:12px}.card{background-position:50% 20%;background-size:cover}.card.art b,.card.art span{text-shadow:0 1px 6px #000,0 0 12px #000;align-self:flex-end;margin-right:8px}#select-row{align-items:flex-start;gap:22px;width:min(708px,90vw);margin-top:22px;display:flex}#select-row #detail{flex:1;width:auto;margin-top:0}#full{filter:drop-shadow(0 0 18px #000);height:300px;display:none}#banner.art{background-position:50%;background-size:cover}#settings{pointer-events:auto;background:#000c;justify-content:center;align-items:center;display:none;position:absolute;inset:0}#settings.show{display:flex}#settings .box{background:#12101a;border:1px solid #5b5560;width:min(440px,92vw);padding:18px 22px}#settings h1{letter-spacing:.4em;margin:0 0 12px;font-size:20px;font-weight:400}#settings label{justify-content:space-between;align-items:center;margin:7px 0;font-size:14px;display:flex}#settings button{color:var(--bone);font:inherit;cursor:pointer;background:#1c1926;border:1px solid #5b5560;min-width:150px;padding:6px 12px}#settings button:hover{border-color:var(--ember)}#settings button.primary{background:var(--ember);color:#1a0d08;font-weight:700}#settings .row{justify-content:flex-end;gap:10px;margin-top:14px;display:flex}#settings p{opacity:.6;font-size:12px;line-height:1.7}#banner.show,#go.show{pointer-events:auto;cursor:pointer}#touch{pointer-events:none;touch-action:none;-webkit-user-select:none;user-select:none;position:fixed;inset:0}#stick{pointer-events:auto;touch-action:none;width:46%;height:62%;position:absolute;bottom:0;left:0}#stick i{background:#e8e2d618;border:2px solid #e8e2d655;border-radius:50%;width:86px;height:86px;position:absolute;bottom:70px;left:70px}#pad{pointer-events:none;width:236px;height:196px;position:absolute;bottom:18px;right:14px}#pad button{all:unset;width:74px;height:74px;color:var(--bone);text-align:center;pointer-events:auto;touch-action:none;background:#0008;border:2px solid #e8e2d677;border-radius:50%;font:700 24px/74px Noto Serif SC,serif;position:absolute}#pad button.on{border-color:var(--ember);background:#ff6a2a99}#pad button[data-b=LP]{border-color:var(--ember);bottom:0;right:82px}#pad button[data-b=HP]{bottom:44px;right:0}#pad button[data-b=JUMP]{bottom:26px;right:164px}#pad button.s{width:58px;height:58px;font-size:19px;line-height:58px}#pad button[data-b=SPECIAL]{border-color:#ffb347;bottom:94px;right:88px}#pad button[data-b=DODGE]{bottom:132px;right:8px}body:not(.playing) #touch,body.touch #help{display:none}body.touch #links{top:76px;bottom:auto}#toast{text-align:center;letter-spacing:.3em;color:#ffd27a;opacity:0;font-size:18px;position:absolute;bottom:22vh;left:0;right:0}#toast.show{animation:1.2s toast}@keyframes toast{0%{opacity:0;transform:translateY(10px)}15%,70%{opacity:1;transform:none}to{opacity:0}}.dmg{color:#fff1c9;-webkit-text-stroke:1px #3a1a08;pointer-events:none;font:italic 900 22px Georgia,serif;animation:.7s ease-out forwards dmg;position:absolute;transform:translate(-50%,-50%)}.dmg.big{color:var(--ember);font-size:34px}.dmg.hero{color:#ff5a5a}@keyframes dmg{0%{opacity:1;margin-top:0;scale:1.5}20%{scale:1}to{opacity:0;margin-top:-70px}}#links{pointer-events:auto;font-size:12px;position:absolute;bottom:14px;right:20px}#links a{color:var(--bone);opacity:.6;margin-left:14px}#links a:hover{opacity:1;color:var(--ember)}#help{opacity:.55;letter-spacing:.05em;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.7;position:absolute;bottom:14px;left:20px}</style>

<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="player" class="panel"><div class="name" id="p-name"></div><div class="bar"><i id="p-hp"></i></div><div class="bar en"><i id="p-en"></i></div></div>
  <div id="enemy" class="panel"><div class="name" id="e-name"></div><div class="bar"><i id="e-hp"></i></div></div>
  <div id="wave"></div>
  <div id="combo"><span id="combo-n">0</span><small>连击 HITS</small></div>
  <div id="flash"></div>
  <div id="toast"></div>
  <div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>
  <div id="select"><h1>选择持名者</h1><div id="cards"></div><div id="select-row"><div id="detail"></div><img id="full" alt="" /></div>
    <div class="tip">A / D 切换 · Enter 或 J 确认 · 战斗中按 Esc 返回这里</div></div>
  <div id="boss"><div class="name" id="boss-name"></div><div class="bar"><i id="boss-hp"></i></div></div>
  <div id="go">GO →</div>
  <div id="map"><h1 id="map-title"></h1><svg id="map-svg" viewBox="0 0 820 400"></svg><div id="map-info"></div>
    <div class="tip">W / S / A / D 选择下一站 · Enter 或 J 出发 · 相邻的路线可以互通</div></div>
  <div id="fade"></div>
  <div id="links"><a href="#" id="open-settings">设置</a><a href="./train.html">AI 训练场</a><a href="./editor.html">角色 / 地图编辑器</a></div>
  <div id="help">
    WASD 移动 · →→ 冲刺(冲刺中攻击 = 突进技) · 空格 跳(被打飞时按 = 受身) · Shift 闪避<br>
    J 轻攻击(↓+J 踢技) · K 重攻击(↓+K 挑空) · J+K 抓投<br>
    L 特殊技:L / →+L / ↓+L / ↑+L(奥义) · 连段:轻 → 重 → 指令技 → 特殊技
  </div>
</div>
