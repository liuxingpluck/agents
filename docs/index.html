<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>烬渊 · Ashen Abyss</title>
<style>:root{--ember:#ff6a2a;--bone:#e8e2d6;--ink:#07060a}html,body{background:var(--ink);height:100%;color:var(--bone);-webkit-user-select:none;user-select:none;margin:0;font-family:Noto Serif SC,Songti SC,SimSun,Georgia,serif;overflow:hidden}#game{width:100%;height:100%;display:block;position:fixed;inset:0}#hud{pointer-events:none;text-shadow:0 2px 6px #000;position:fixed;inset:0}.panel{width:min(36vw,420px);position:absolute;top:18px}#player{left:20px}#enemy{text-align:right;opacity:0;transition:opacity .3s;right:20px}.name{letter-spacing:.12em;margin-bottom:6px;font-size:15px}.bar{background:#0009;border:1px solid #5b5560;height:14px;overflow:hidden;transform:skew(-18deg)}.bar>i{background:linear-gradient(#d94a3a,#7a1f1f);width:100%;height:100%;transition:width .12s;display:block}.bar.en{width:70%;height:7px;margin-top:5px}.bar.en>i{background:linear-gradient(#ffb347, var(--ember));width:0}#enemy .bar{margin-left:auto}#enemy .bar>i{background:linear-gradient(#b9b4ad,#55555c);margin-left:auto}#wave{letter-spacing:.3em;opacity:.7;font-size:13px;position:absolute;top:18px;left:50%;transform:translate(-50%)}#combo{text-align:right;opacity:0;font-style:italic;transition:opacity .25s;position:absolute;top:26vh;right:5vw}#combo-n{color:var(--ember);font-size:84px;font-weight:900;line-height:1}#combo small{letter-spacing:.4em;font-size:14px;display:block}#combo.pop #combo-n{animation:.18s pop}@keyframes pop{0%{transform:scale(1.5)}to{transform:scale(1)}}#flash{text-align:center;letter-spacing:.5em;opacity:0;font-size:30px;position:absolute;top:30vh;left:0;right:0}#flash.show{animation:2.2s flash}@keyframes flash{0%{opacity:0;letter-spacing:1em}15%,70%{opacity:1;letter-spacing:.5em}to{opacity:0}}#banner{text-align:center;background:radial-gradient(#000a 0%,#000d 70%);flex-direction:column;justify-content:center;align-items:center;display:none;position:absolute;inset:0}#banner.show{animation:.6s fadein;display:flex}@keyframes fadein{0%{opacity:0}}#banner-title{letter-spacing:.3em;background:linear-gradient(#f4e9d8 30%, var(--ember));color:#0000;text-shadow:none;-webkit-background-clip:text;background-clip:text;margin-right:-.3em;font-size:clamp(48px,9vw,120px);font-weight:900}#banner-sub{letter-spacing:.15em;opacity:.9;margin-top:18px;font-size:16px;line-height:1.9}#banner-sub b{color:var(--ember)}#banner-sub em{letter-spacing:.6em;opacity:.6;font-size:13px}#select{pointer-events:auto;background:radial-gradient(#000b 0%,#000e 75%);flex-direction:column;justify-content:center;align-items:center;display:none;position:absolute;inset:0}#select.show{animation:.4s fadein;display:flex}#select h1{letter-spacing:.6em;opacity:.8;margin:0 0 22px;font-size:22px;font-weight:400}#cards{grid-template-columns:repeat(5,132px);gap:12px;display:grid}.card{all:unset;cursor:pointer;background:linear-gradient(160deg, var(--c), #0b0a10 70%);border:1px solid #5b5560;flex-direction:column;justify-content:center;align-items:center;gap:6px;height:86px;transition:transform .12s;display:flex;position:relative}.card:after{content:"";background:var(--c2);height:4px;position:absolute;bottom:0;left:0;right:0}.card b{letter-spacing:.2em;font-size:20px}.card span{opacity:.7;letter-spacing:.2em;font-size:12px}.card.on{border-color:var(--ember);transform:translateY(-6px);box-shadow:0 0 22px #ff6a2a66}#detail{text-align:left;width:min(708px,90vw);min-height:190px;margin-top:22px;font-size:14px;line-height:1.8}#detail h2{letter-spacing:.15em;margin:0 0 6px;font-size:26px}#detail h2 small{opacity:.65;margin-left:10px;font-size:14px}#detail p{margin:4px 0}.mono{opacity:.75;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}#select .tip{opacity:.55;letter-spacing:.15em;margin-top:10px;font-size:12px}#links{pointer-events:auto;font-size:12px;position:absolute;bottom:14px;right:20px}#links a{color:var(--bone);opacity:.6;margin-left:14px}#links a:hover{opacity:1;color:var(--ember)}#help{opacity:.55;letter-spacing:.05em;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.7;position:absolute;bottom:14px;left:20px}</style>
  <script type="module" crossorigin src="./assets/main-CSFIyfnS.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/renderer-DAToudnG.js">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="player" class="panel"><div class="name" id="p-name"></div><div class="bar"><i id="p-hp"></i></div><div class="bar en"><i id="p-en"></i></div></div>
  <div id="enemy" class="panel"><div class="name" id="e-name"></div><div class="bar"><i id="e-hp"></i></div></div>
  <div id="wave"></div>
  <div id="combo"><span id="combo-n">0</span><small>连击 HITS</small></div>
  <div id="flash"></div>
  <div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>
  <div id="select"><h1>选择持名者</h1><div id="cards"></div><div id="detail"></div>
    <div class="tip">A / D 切换 · Enter 或 J 确认 · 战斗中按 Esc 返回这里</div></div>
  <div id="links"><a href="./train.html">AI 训练场</a></div>
  <div id="help">
    WASD 移动 · →→ 冲刺 · 空格 跳 · Shift 闪避<br>
    J 轻攻击(↓+J 踢技) · K 重攻击(↓+K 挑空) · J+K 抓投<br>
    L 特殊技:L / →+L / ↓+L / ↑+L(奥义) · 连段:轻 → 重 → 指令技 → 特殊技
  </div>
</div>
</body>
</html>
