<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>角色 / 地图编辑器 · 烬渊</title>
<style>
  :root { --ember: #ff6a2a; --bone: #e8e2d6; --ink: #0b0a10; --line: #3a3642; --panel: #12101a; --field: #1c1926; --bad: #e0584a; --good: #6fbf73; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--bone);
    font-family: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif; }
  header { padding: 18px 24px 8px; display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: .3em; }
  header a { color: var(--bone); opacity: .6; font-size: 13px; } header a:hover { color: var(--ember); opacity: 1; }
  header p { margin: 0; font-size: 13px; opacity: .6; flex-basis: 100%; line-height: 1.7; }
  .note { font-size: 12px; opacity: .7; line-height: 1.6; } .note.warn { color: var(--bad); opacity: 1; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 520px); gap: 18px; padding: 8px 24px 32px; align-items: start; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; padding: 8px 16px 24px; } #side { order: -1; position: static !important; } }
  #side { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 10px; }
  #arena-wrap { position: relative; border: 1px solid var(--line); background: var(--panel); overflow: hidden; }
  #arena { width: 100%; display: block; aspect-ratio: 16 / 9; outline: none; }
  #arena:focus { box-shadow: inset 0 0 0 2px var(--ember); }
  #arena-info { position: absolute; left: 12px; top: 8px; font-size: 13px; text-shadow: 0 1px 4px #000; line-height: 1.7; pointer-events: none; }
  #arena-info b { color: var(--ember); }
  #tabbar { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
  .tab-btn { background: transparent; border: 1px solid transparent; border-bottom: none; padding: 9px 20px; letter-spacing: .25em; opacity: .6; }
  .tab-btn.on { background: var(--panel); border-color: var(--line); opacity: 1; color: var(--ember); }
  section { border: 1px solid var(--line); background: var(--panel); padding: 12px 16px 14px; margin: 0 0 14px; }
  h3 { margin: 0 0 10px; font-size: 14px; letter-spacing: .3em; opacity: .75; font-weight: 400; }
  h4 { margin: 14px 0 6px; font-size: 13px; opacity: .65; font-weight: 400; }
  h4 label { opacity: 1; }
  .hint { font-size: 12px; opacity: .6; margin: 0 0 8px; line-height: 1.7; }
  label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; min-width: 0; }
  label.fld > span { opacity: .65; }
  .inline { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  input[type=text], input[type=number], select, textarea { background: var(--field); color: var(--bone); border: 1px solid var(--line); padding: 5px 8px; font: inherit; font-size: 14px; width: 100%; min-width: 0; }
  textarea { resize: vertical; line-height: 1.6; }
  input[type=color] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--line); background: var(--field); }
  input[type=checkbox], input[type=radio] { accent-color: var(--ember); }
  select[multiple] { padding: 2px; }
  .w90 { width: 92px !important; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 14px; margin-bottom: 6px; }
  .grid.g2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .grid.g4 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .grid.g5 { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .checks { display: flex; gap: 18px; flex-wrap: wrap; margin: 8px 0; font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  .row select { width: auto; }
  button { background: var(--field); color: var(--bone); border: 1px solid var(--line); padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer; letter-spacing: .1em; }
  button:hover { border-color: var(--ember); }
  button.primary { background: var(--ember); color: #1a0d08; border-color: var(--ember); font-weight: 700; }
  button.danger { color: var(--bad); } button.danger:hover { border-color: var(--bad); }
  button.sm { padding: 3px 9px; font-size: 12px; }
  .list { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .list .item { text-align: left; } .list .item.on { border-color: var(--ember); color: var(--ember); }
  .list small { opacity: .6; font-size: 11px; }
  .empty { font-size: 13px; opacity: .6; padding: 6px 0; }
  .tablewrap { overflow-x: auto; }
  table.moves { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.moves th { text-align: left; font-weight: 400; opacity: .6; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.moves td { padding: 3px 4px; vertical-align: top; }
  table.moves td input[type=text], table.moves td input[type=number], table.moves td select { padding: 3px 5px; font-size: 13px; }
  table.moves td select { min-width: 84px; }
  table.moves td.acts { white-space: nowrap; }
  table.moves tr.tier4 > td:first-child { border-left: 2px solid var(--ember); }
  tr.detail > td { background: #0e0c15; border: 1px solid var(--line); padding: 8px 12px 12px; }
  .maprow { display: flex; gap: 8px; align-items: center; margin: 5px 0; } .maprow select { width: auto; min-width: 120px; }
  .tag { font-size: 12px; opacity: .8; min-width: 44px; color: var(--ember); }
  .wave { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; } .wave select { width: auto; }
  .chips { display: inline-flex; gap: 5px; flex-wrap: wrap; }
  .chip { background: var(--field); border: 1px solid var(--line); padding: 2px 4px 2px 9px; font-size: 13px; display: inline-flex; gap: 4px; align-items: center; }
  .chip .x { padding: 0 6px; border: none; background: transparent; font-size: 15px; }
  .errs { font-size: 13px; line-height: 1.7; } .errs ul { margin: 4px 0 0; padding-left: 20px; }
  .errs.bad { border-left: 3px solid var(--bad); padding-left: 10px; } .errs .cnt { color: var(--bad); }
  .errs.good .ok { color: var(--good); }
  .graphbox { overflow-x: auto; }
  svg.graph { width: 100%; max-width: 520px; height: auto; display: block; background: #0e0c15; border: 1px solid var(--line); }
  svg.graph .lane { fill: #15121d; } svg.graph text.lanelabel { text-anchor: start; opacity: .4; font-size: 10px; }
  svg.graph .edge { fill: none; stroke: #77707f; stroke-width: 1.6; } svg.graph .edge.cross { stroke: var(--ember); opacity: .75; }
  svg.graph .arrow { fill: #77707f; }
  svg.graph .node { stroke: var(--bone); stroke-width: 1.5; fill: #2a2733; }
  svg.graph .node.k-elite { fill: #6b5520; stroke: #d9b24a; } svg.graph .node.k-rest { fill: #1f4a2c; stroke: var(--good); }
  svg.graph .node.k-boss { fill: #6a1f1a; stroke: var(--bad); }
  svg.graph .node.start { stroke-width: 3; }
  svg.graph text { fill: var(--bone); font-size: 11px; text-anchor: middle; }
  svg.graph .nodelabel { font-size: 10px; opacity: .75; } svg.graph .startmark { fill: var(--ember); font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>角色 / 地图编辑器</h1><a href="./index.html">← 返回游戏</a><a href="./train.html">AI 训练场</a>
  <p>在这里创作你自己的角色、房间和章节路线。所有改动都会按规则实时校验、自动保存在本机浏览器;右侧画面可以直接用键盘试玩。完成后在「导入/导出」里导出 .json 与朋友分享。 <span id="save-note" class="note"></span></p>
</header>
<main>
  <div>
    <nav id="tabbar"></nav>
    <div id="content"></div>
  </div>
  <aside id="side">
    <div id="arena-wrap"><canvas id="arena"></canvas><div id="arena-info"></div></div>
    <div class="note">预览画面:点击后用键盘试玩。角色预览里对手是不会倒下的训练木桩,能量自动回满。</div>
  </aside>
</main>
<script type="module" src="/src/editor/main.ts"></script>
</body>
</html>
