<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>烬渊 · Ashen Abyss</title>
<style>
  :root { --ember: #ff6a2a; --bone: #e8e2d6; --ink: #07060a; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; color: var(--bone);
    font-family: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif; user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 2px 6px #000; }
  .panel { position: absolute; top: 18px; width: min(36vw, 420px); }
  #player { left: 20px; } #enemy { right: 20px; text-align: right; opacity: 0; transition: opacity .3s; }
  .name { font-size: 15px; letter-spacing: .12em; margin-bottom: 6px; }
  .bar { height: 14px; background: #0009; border: 1px solid #5b5560; transform: skewX(-18deg); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: linear-gradient(#d94a3a, #7a1f1f); transition: width .12s; }
  .bar.en { height: 7px; margin-top: 5px; width: 70%; } .bar.en > i { background: linear-gradient(#ffb347, var(--ember)); width: 0; }
  #enemy .bar { margin-left: auto; } #enemy .bar > i { margin-left: auto; background: linear-gradient(#b9b4ad, #55555c); }
  #wave { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: 13px; letter-spacing: .3em; opacity: .7; }
  #combo { position: absolute; right: 5vw; top: 26vh; text-align: right; opacity: 0; transition: opacity .25s; font-style: italic; }
  #combo-n { font-size: 84px; font-weight: 900; color: var(--ember); line-height: 1; }
  #combo small { display: block; letter-spacing: .4em; font-size: 14px; }
  #combo.pop #combo-n { animation: pop .18s; } @keyframes pop { from { transform: scale(1.5); } to { transform: scale(1); } }
  #flash { position: absolute; left: 0; right: 0; top: 30vh; text-align: center; font-size: 30px; letter-spacing: .5em; opacity: 0; }
  #flash.show { animation: flash 2.2s; } @keyframes flash { 0% { opacity: 0; letter-spacing: 1em; } 15%, 70% { opacity: 1; letter-spacing: .5em; } 100% { opacity: 0; } }
  #banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
    background: radial-gradient(ellipse at center, #000a 0%, #000d 70%); text-align: center; }
  #banner.show { display: flex; animation: fadein .6s; } @keyframes fadein { from { opacity: 0; } }
  #banner-title { font-size: clamp(48px, 9vw, 120px); font-weight: 900; letter-spacing: .3em; margin-right: -.3em;
    background: linear-gradient(#f4e9d8 30%, var(--ember)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  #banner-sub { margin-top: 18px; font-size: 16px; line-height: 1.9; letter-spacing: .15em; opacity: .9; }
  #banner-sub b { color: var(--ember); } #banner-sub em { letter-spacing: .6em; opacity: .6; font-size: 13px; }
  #select { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #000b 0%, #000e 75%); pointer-events: auto; }
  #select.show { display: flex; animation: fadein .4s; }
  #select h1 { font-size: 22px; letter-spacing: .6em; margin: 0 0 22px; opacity: .8; font-weight: 400; }
  #cards { display: grid; grid-template-columns: repeat(5, 132px); gap: 12px; }
  .card { all: unset; cursor: pointer; height: 86px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid #5b5560; background: linear-gradient(160deg, var(--c), #0b0a10 70%); position: relative; transition: transform .12s; }
  .card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--c2); }
  .card b { font-size: 20px; letter-spacing: .2em; } .card span { font-size: 12px; opacity: .7; letter-spacing: .2em; }
  .card.on { border-color: var(--ember); transform: translateY(-6px); box-shadow: 0 0 22px #ff6a2a66; }
  #detail { width: min(708px, 90vw); min-height: 190px; margin-top: 22px; text-align: left; line-height: 1.8; font-size: 14px; }
  #detail h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: .15em; } #detail h2 small { font-size: 14px; opacity: .65; margin-left: 10px; }
  #detail p { margin: 4px 0; } .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; opacity: .75; }
  #select .tip { margin-top: 10px; font-size: 12px; opacity: .55; letter-spacing: .15em; }
  #boss { position: absolute; left: 50%; bottom: 84px; width: min(60vw, 720px); transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .4s; }
  #boss.show { opacity: 1; } #boss .name { color: var(--ember); letter-spacing: .3em; }
  #boss .bar { height: 12px; } #boss .bar > i { background: linear-gradient(#ff8a4a, #8a1f10); }
  #go { position: absolute; right: 5vw; top: 44vh; font-size: 54px; font-weight: 900; font-style: italic; color: var(--ember); opacity: 0; letter-spacing: .1em; }
  #go.show { animation: go 0.9s infinite; } @keyframes go { 0%, 100% { opacity: 1; transform: translateX(0); } 50% { opacity: .35; transform: translateX(16px); } }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .4s; }
  #fade.on { opacity: 1; }
  #map { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #000c 0%, #000f 80%); pointer-events: auto; }
  #map.show { display: flex; animation: fadein .4s; }
  #map h1 { font-size: 24px; letter-spacing: .4em; margin: 0 0 6px; font-weight: 400; }
  #map-svg { width: min(820px, 94vw); height: auto; }
  #map-info { min-height: 3.4em; text-align: center; font-size: 14px; line-height: 1.7; letter-spacing: .1em; }
  #map-info b { color: var(--ember); }
  #map .tip { font-size: 12px; opacity: .55; letter-spacing: .15em; margin-top: 6px; }
  .card { background-size: cover; background-position: center 20%; }
  .card.art b, .card.art span { text-shadow: 0 1px 6px #000, 0 0 12px #000; align-self: flex-end; margin-right: 8px; }
  #select-row { display: flex; gap: 22px; align-items: flex-start; width: min(708px, 90vw); margin-top: 22px; }
  #select-row #detail { margin-top: 0; flex: 1; width: auto; }
  #full { height: 300px; display: none; filter: drop-shadow(0 0 18px #000); }
  #banner.art { background-size: cover; background-position: center; }
  #settings { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #000c; pointer-events: auto; }
  #settings.show { display: flex; }
  #settings .box { width: min(440px, 92vw); border: 1px solid #5b5560; background: #12101a; padding: 18px 22px; }
  #settings h1 { margin: 0 0 12px; font-size: 20px; letter-spacing: .4em; font-weight: 400; }
  #settings label { display: flex; justify-content: space-between; align-items: center; margin: 7px 0; font-size: 14px; }
  #settings button { background: #1c1926; color: var(--bone); border: 1px solid #5b5560; padding: 6px 12px; font: inherit; cursor: pointer; min-width: 150px; }
  #settings button:hover { border-color: var(--ember); } #settings button.primary { background: var(--ember); color: #1a0d08; font-weight: 700; }
  #settings .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; } #settings p { font-size: 12px; opacity: .6; line-height: 1.7; }
  #banner.show, #go.show { pointer-events: auto; cursor: pointer; }
  #touch { position: fixed; inset: 0; pointer-events: none; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stick { position: absolute; left: 0; bottom: 0; width: 46%; height: 62%; pointer-events: auto; touch-action: none; }
  #stick i { position: absolute; left: 70px; bottom: 70px; width: 86px; height: 86px; border-radius: 50%; border: 2px solid #e8e2d655; background: #e8e2d618; }
  #pad { position: absolute; right: 14px; bottom: 18px; width: 236px; height: 196px; pointer-events: none; }
  #pad button { all: unset; position: absolute; width: 74px; height: 74px; border-radius: 50%; border: 2px solid #e8e2d677; background: #0008; color: var(--bone);
    font: 700 24px "Noto Serif SC", serif; text-align: center; line-height: 74px; pointer-events: auto; touch-action: none; }
  #pad button.on { background: #ff6a2a99; border-color: var(--ember); }
  #pad button[data-b=LP] { right: 82px; bottom: 0; border-color: var(--ember); } #pad button[data-b=HP] { right: 0; bottom: 44px; }
  #pad button[data-b=JUMP] { right: 164px; bottom: 26px; } #pad button.s { width: 58px; height: 58px; line-height: 58px; font-size: 19px; }
  #pad button[data-b=SPECIAL] { right: 88px; bottom: 94px; border-color: #ffb347; } #pad button[data-b=DODGE] { right: 8px; bottom: 132px; }
  body:not(.playing) #touch { display: none; } /* 菜单界面不显示触屏按键,以免挡住点击 */
  body.touch #help { display: none; } body.touch #links { bottom: auto; top: 76px; }
  #moves { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #000c; }
  #moves.show { display: flex; }
  #moves .box { width: min(560px, 94vw); border: 1px solid #5b5560; background: #12101af2; padding: 16px 22px; }
  #moves h1 { margin: 0 0 10px; font-size: 20px; letter-spacing: .3em; font-weight: 400; }
  #moves table { width: 100%; border-collapse: collapse; font-size: 14px; }
  #moves td { padding: 4px 6px; border-bottom: 1px solid #ffffff14; } #moves td:first-child { color: var(--ember); white-space: nowrap; font-family: ui-monospace, Menlo, monospace; width: 38%; }
  #moves small { opacity: .6; } #moves p { font-size: 12px; opacity: .7; line-height: 1.7; margin: 10px 0 0; } #moves b { color: var(--ember); }
  #toast { position: absolute; left: 0; right: 0; bottom: 22vh; text-align: center; font-size: 18px; letter-spacing: .3em; color: #ffd27a; opacity: 0; }
  #toast.show { animation: toast 1.2s; } @keyframes toast { 0% { opacity: 0; transform: translateY(10px); } 15%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .dmg { position: absolute; font: 900 italic 22px Georgia, serif; color: #fff1c9; -webkit-text-stroke: 1px #3a1a08; pointer-events: none;
    animation: dmg .7s ease-out forwards; transform: translate(-50%, -50%); }
  .dmg.big { font-size: 34px; color: var(--ember); } .dmg.hero { color: #ff5a5a; }
  @keyframes dmg { 0% { opacity: 1; margin-top: 0; scale: 1.5; } 20% { scale: 1; } 100% { opacity: 0; margin-top: -70px; } }
  #links { position: absolute; right: 20px; bottom: 14px; font-size: 12px; pointer-events: auto; }
  #links a { color: var(--bone); opacity: .6; margin-left: 14px; } #links a:hover { opacity: 1; color: var(--ember); }
  #help { position: absolute; left: 20px; bottom: 14px; font-size: 12px; opacity: .55; line-height: 1.7; letter-spacing: .05em;
    font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="player" class="panel"><div class="name" id="p-name"></div><div class="bar"><i id="p-hp"></i></div><div class="bar en"><i id="p-en"></i></div></div>
  <div id="enemy" class="panel"><div class="name" id="e-name"></div><div class="bar"><i id="e-hp"></i></div></div>
  <div id="wave"></div>
  <div id="combo"><span id="combo-n">0</span><small>连击 HITS</small></div>
  <div id="flash"></div>
  <div id="toast"></div>
  <div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>
  <div id="select"><h1>选择持名者</h1><div id="cards"></div><div id="select-row"><div id="detail"></div><img id="full" alt="" /></div>
    <div class="tip">A / D 切换 · Enter 或 J 确认 · 战斗中按 Esc 返回这里</div></div>
  <div id="boss"><div class="name" id="boss-name"></div><div class="bar"><i id="boss-hp"></i></div></div>
  <div id="go">GO →</div>
  <div id="map"><h1 id="map-title"></h1><svg id="map-svg" viewBox="0 0 820 400"></svg><div id="map-info"></div>
    <div class="tip">W / S / A / D 选择下一站 · Enter 或 J 出发 · 相邻的路线可以互通</div></div>
  <div id="moves"></div>
  <div id="fade"></div>
  <div id="links"><a href="#" id="open-settings">设置</a><a href="./train.html">AI 训练场</a><a href="./editor.html">角色 / 地图编辑器</a></div>
  <div id="help">
    WASD 移动 · →→ 冲刺(冲刺中攻击 = 突进技) · 空格 跳(被打飞时按 = 受身) · Shift 闪避<br>
    J 轻攻击(↓+J 踢技) · K 重攻击(↓+K 挑空) · J+K 抓投<br>
    L 特殊技:L / →+L / ↓+L / ↑+L(奥义) · <b>Tab 招式表</b> · Esc 返回标题
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
