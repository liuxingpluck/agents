<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 训练场 · 烬渊</title>
<style>
  :root { --ember: #ff6a2a; --bone: #e8e2d6; --ink: #0b0a10; --line: #3a3642; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--bone);
    font-family: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif; }
  header { padding: 18px 24px 8px; display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: .3em; }
  header a { color: var(--bone); opacity: .6; font-size: 13px; } header a:hover { color: var(--ember); opacity: 1; }
  header p { margin: 0; font-size: 13px; opacity: .6; flex-basis: 100%; line-height: 1.7; }
  main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 18px; padding: 12px 24px 24px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px 24px; } }
  section { border: 1px solid var(--line); background: #12101a; padding: 14px 16px; }
  h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: .3em; opacity: .7; font-weight: 400; }
  label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; font-size: 14px; gap: 10px; }
  select, input[type=number] { background: #1c1926; color: var(--bone); border: 1px solid var(--line); padding: 5px 8px; font: inherit; width: 150px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button { background: #1c1926; color: var(--bone); border: 1px solid var(--line); padding: 8px 14px; font: inherit; cursor: pointer; letter-spacing: .1em; }
  button:hover { border-color: var(--ember); } button.primary { background: var(--ember); color: #1a0d08; border-color: var(--ember); font-weight: 700; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
  dt { opacity: .6; } dd { margin: 0; text-align: right; font-family: ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  #chart { width: 100%; height: 190px; display: block; margin-top: 6px; }
  .legend { font-size: 12px; opacity: .75; display: flex; gap: 16px; margin-top: 6px; }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; }
  #arena-wrap { position: relative; padding: 0; overflow: hidden; min-height: 320px; }
  #arena { width: 100%; height: 100%; min-height: 320px; display: block; aspect-ratio: 16 / 9; }
  #arena-info { position: absolute; left: 14px; top: 10px; font-size: 13px; text-shadow: 0 1px 4px #000; line-height: 1.7; }
  #arena-info b { color: var(--ember); }
  .stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  #status { font-size: 13px; opacity: .7; margin-top: 10px; min-height: 1.4em; }
</style>
</head>
<body>
<header>
  <h1>AI 训练场</h1><a href="./index.html">← 返回游戏</a>
  <p>这里的 AI 完全在你的浏览器里训练:多个后台线程以最高速度空跑对战,用进化策略一代代改进一个小型神经网络。
     它直接读取游戏内部数据(位置、帧数、血量),不看画面。模型自动保存在本机,关掉页面下次可以接着练。</p>
</header>
<main>
  <div class="stack">
    <section>
      <h2>设置</h2>
      <label>训练角色 <select id="hero"></select></label>
      <label>对手角色 <select id="foe"></select></label>
      <label>后台线程数 <input id="workers" type="number" min="1" max="32" /></label>
      <label>自博弈(和过去的自己打) <input id="selfplay" type="checkbox" checked /></label>
      <label>联赛(对战其他已练好的角色)<span id="league-n" style="opacity:.6;font-size:12px"></span> <input id="league" type="checkbox" checked /></label>
      <div class="row">
        <button id="toggle" class="primary">开始训练</button>
        <button id="reset">重置模型</button>
        <button id="export">导出</button>
        <button id="import">导入</button>
        <input id="file" type="file" accept=".json" hidden />
      </div>
      <div id="status"></div>
    </section>
    <section>
      <h2>进度</h2>
      <dl>
        <dt>代数</dt><dd id="s-gen">0</dd>
        <dt>对脚本 AI 胜率</dt><dd id="s-win">—</dd>
        <dt>对连打机器人胜率</dt><dd id="s-hard">—</dd>
        <dt>造成 / 承受伤害</dt><dd id="s-dmg">—</dd>
        <dt>考试中最高连击</dt><dd id="s-combo">—</dd>
        <dt>本代平均 / 最高分</dt><dd id="s-fit">—</dd>
        <dt>模拟速度(上限估计)</dt><dd id="s-sps">—</dd>
        <dt>每代耗时</dt><dd id="s-ms">—</dd>
        <dt>对手池</dt><dd id="s-pool">0</dd>
      </dl>
      <canvas id="chart"></canvas>
      <div class="legend"><span><i style="background:#ff6a2a"></i>对脚本 AI 胜率</span><span><i style="background:#7ad0ff"></i>对连打机器人胜率</span><span><i style="background:#e8e2d6"></i>伤害差(造成 − 承受)</span></div>
    </section>
  </div>
  <section id="arena-wrap">
    <canvas id="arena"></canvas>
    <div id="arena-info"></div>
  </section>
</main>
<script type="module" src="/src/train.ts"></script>
</body>
</html>
